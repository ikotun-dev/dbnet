name: Release binaries

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: darwin
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: linux
            goarch: amd64
          - goos: windows
            goarch: arm64
          - goos: windows
            goarch: amd64
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: npm run assets:sync
      - run: node --test lib/connection-url.test.mjs
      - run: go test ./...
      - name: Build archive
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: |
          set -eu
          version="${GITHUB_REF_NAME}"
          name="dbnet-${version}-${GOOS}-${GOARCH}"
          executable="dbnet"
          if [ "$GOOS" = "windows" ]; then executable="dbnet.exe"; fi
          mkdir -p "stage/${name}" dist
          go build -trimpath -ldflags="-s -w" -o "stage/${name}/${executable}" ./cmd/dbnet
          cp README.md LICENSE "stage/${name}/"
          if [ "$GOOS" = "windows" ]; then
            (cd stage && zip -qr "../dist/${name}.zip" "${name}")
          else
            tar -C stage -czf "dist/${name}.tar.gz" "${name}"
          fi
          sha256sum dist/* > "dist/${name}.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: dbnet-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/*
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v5
        with:
          path: dist
          merge-multiple: true
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --verify-tag --generate-notes --title "DBNet $GITHUB_REF_NAME"
