name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: npm run assets:sync
      - run: node --test lib/connection-url.test.mjs
      - run: go test ./...
      - run: go vet ./...
      - run: go build -trimpath ./cmd/dbnet
